<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Entropic risk reweighting for quadrotor hover domain randomization</title>
<desc id="desc">A conceptual three-stage diagram: sample dynamics parameters, evaluate hover return, and reweight harder parameter regions with an exponential tilt. A dual beta update controls the KL divergence from the uniform distribution.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcfa"/><stop offset="1" stop-color="#edf3f1"/></linearGradient>
 <linearGradient id="field" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#dcebe7"/><stop offset=".55" stop-color="#9fc9bd"/><stop offset="1" stop-color="#547d78"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#42676a"/></marker>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8ca9a2" stroke-width="1" opacity=".3"/></pattern>
 <style>
  text{font-family:Inter,Arial,sans-serif;fill:#19373c} .muted{fill:#5f7779}.tiny{font-size:14px}.label{font-size:16px;font-weight:700;letter-spacing:.04em}.head{font-size:23px;font-weight:700}.math{font-family:Georgia,serif;font-size:23px}.axis{stroke:#526e70;stroke-width:1.5;fill:none}.flow{stroke:#42676a;stroke-width:2;fill:none;marker-end:url(#arrow)}.frame{fill:#fff;stroke:#d5e1de;stroke-width:1.5}
 </style>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#paper)"/>
<text x="58" y="56" class="label" fill="#287b78">TRADR · METHOD SCHEMATIC</text>
<text x="58" y="91" class="head">Policy performance reshapes the training distribution</text>
<text x="1142" y="57" text-anchor="end" class="tiny muted">Conceptual diagram · no measured data shown</text>

<!-- stage 1 -->
<rect x="52" y="126" width="330" height="314" rx="16" class="frame"/>
<circle cx="82" cy="158" r="16" fill="#287b78"/><text x="82" y="164" text-anchor="middle" font-size="16" fill="#fff">1</text>
<text x="110" y="164" class="label">DYNAMICS PARAMETER SPACE</text>
<text x="82" y="193" class="tiny muted">Domain randomization samples θ ∈ Θ</text>
<rect x="103" y="214" width="220" height="176" fill="url(#grid)" stroke="#b8cbc6"/>
<path d="M103 390V214M103 390H330" class="axis"/>
<g fill="#287b78" opacity=".82">
 <circle cx="125" cy="245" r="4"/><circle cx="153" cy="245" r="4"/><circle cx="181" cy="245" r="4"/><circle cx="209" cy="245" r="4"/><circle cx="237" cy="245" r="4"/><circle cx="265" cy="245" r="4"/><circle cx="293" cy="245" r="4"/>
 <circle cx="125" cy="275" r="4"/><circle cx="153" cy="275" r="4"/><circle cx="181" cy="275" r="4"/><circle cx="209" cy="275" r="4"/><circle cx="237" cy="275" r="4"/><circle cx="265" cy="275" r="4"/><circle cx="293" cy="275" r="4"/>
 <circle cx="125" cy="305" r="4"/><circle cx="153" cy="305" r="4"/><circle cx="181" cy="305" r="4"/><circle cx="209" cy="305" r="4"/><circle cx="237" cy="305" r="4"/><circle cx="265" cy="305" r="4"/><circle cx="293" cy="305" r="4"/>
 <circle cx="125" cy="335" r="4"/><circle cx="153" cy="335" r="4"/><circle cx="181" cy="335" r="4"/><circle cx="209" cy="335" r="4"/><circle cx="237" cy="335" r="4"/><circle cx="265" cy="335" r="4"/><circle cx="293" cy="335" r="4"/>
 <circle cx="125" cy="365" r="4"/><circle cx="153" cy="365" r="4"/><circle cx="181" cy="365" r="4"/><circle cx="209" cy="365" r="4"/><circle cx="237" cy="365" r="4"/><circle cx="265" cy="365" r="4"/><circle cx="293" cy="365" r="4"/>
</g>
<text x="213" y="414" text-anchor="middle" class="tiny muted">θ₁: mass · inertia · COM · thrust · wind</text>
<text x="87" y="300" transform="rotate(-90 87 300)" text-anchor="middle" class="tiny muted">θ₂</text>

<path d="M390 280H429" class="flow"/>
<!-- stage 2 -->
<rect x="440" y="126" width="320" height="314" rx="16" class="frame"/>
<circle cx="470" cy="158" r="16" fill="#287b78"/><text x="470" y="164" text-anchor="middle" font-size="16" fill="#fff">2</text>
<text x="498" y="164" class="label">EVALUATE POLICY</text>
<text x="470" y="193" class="tiny muted">Hover return R(θ) over the parameter grid</text>
<rect x="481" y="214" width="220" height="176" fill="url(#field)" stroke="#b8cbc6"/>
<path d="M481 390V214M481 390H708" class="axis"/>
<path d="M543 352c14-53 55-85 106-75 31 6 46 28 48 55-11 34-37 51-77 49-33-2-56-11-77-29Z" fill="#334f4c" opacity=".32"/>
<path d="M545 350c14-49 56-76 99-67 24 5 36 20 39 44-9 27-31 41-66 40-30-1-52-7-72-17Z" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/>
<g fill="#19373c"><circle cx="510" cy="238" r="4"/><circle cx="575" cy="264" r="4"/><circle cx="650" cy="238" r="4"/><circle cx="676" cy="293" r="4"/><circle cx="612" cy="320" r="4"/></g>
<text x="525" y="370" class="tiny" fill="#fff">lower-return region</text>
<text x="591" y="414" text-anchor="middle" class="tiny muted">R(θ) estimated by simulation</text>

<path d="M768 280H807" class="flow"/>
<!-- stage 3 -->
<rect x="818" y="126" width="330" height="314" rx="16" class="frame"/>
<circle cx="848" cy="158" r="16" fill="#287b78"/><text x="848" y="164" text-anchor="middle" font-size="16" fill="#fff">3</text>
<text x="876" y="164" class="label">RISK-TILTED SAMPLING</text>
<text x="848" y="193" class="tiny muted">Higher density is assigned to harder regions</text>
<rect x="859" y="214" width="220" height="176" fill="#f7faf8" stroke="#b8cbc6"/>
<path d="M859 390V214M859 390H1086" class="axis"/>
<path d="M922 352c14-53 55-85 106-75 31 6 46 28 48 55-11 34-37 51-77 49-33-2-56-11-77-29Z" fill="#e6b36a" opacity=".25"/>
<g fill="#287b78" opacity=".45"><circle cx="887" cy="240" r="3"/><circle cx="980" cy="245" r="3"/><circle cx="1050" cy="245" r="3"/><circle cx="1060" cy="338" r="3"/></g>
<g fill="#bd7436"><circle cx="930" cy="325" r="5"/><circle cx="945" cy="348" r="6"/><circle cx="969" cy="337" r="5"/><circle cx="983" cy="359" r="6"/><circle cx="1005" cy="328" r="5"/><circle cx="1024" cy="349" r="6"/><circle cx="1001" cy="374" r="5"/><circle cx="958" cy="378" r="4"/><circle cx="1036" cy="373" r="4"/></g>
<text x="965" y="414" text-anchor="middle" class="tiny muted">q(θ) ∝ exp(−β R(θ))</text>

<rect x="172" y="464" width="856" height="56" rx="12" fill="#e2eeeb"/>
<text x="600" y="488" text-anchor="middle" class="math">β adjusts the tilt strength so KL(q ‖ p) tracks a target</text>
<text x="600" y="508" text-anchor="middle" class="tiny muted">p: uniform reference distribution · training repeats with the updated q</text>
</svg>